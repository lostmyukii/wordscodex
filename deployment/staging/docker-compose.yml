version: '2.4'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wordscodex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wordscodex
    volumes:
      - wordscodex_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wordscodex -d wordscodex']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deployment/staging/api.Dockerfile
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://wordscodex:${POSTGRES_PASSWORD}@postgres:5432/wordscodex
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      AUTH_DEV_CODE: ${AUTH_DEV_CODE}
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deployment/staging/web.Dockerfile
      args:
        VITE_API_ORIGIN: ${PUBLIC_ORIGIN}
    ports:
      - '${PUBLIC_PORT}:80'
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  wordscodex_staging_postgres:
